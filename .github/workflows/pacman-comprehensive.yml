name: GitHub Profile README Graphics Generator

on:
  workflow_dispatch: # Memungkinkan menjalankan workflow secara manual
  schedule:
    - cron: "0 0 * * *" # Berjalan setiap hari pada pukul 00:00 UTC
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move output files
        run: |
          mkdir -p output
          mv dist/snake.svg output/

      - name: Push to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output
          branch: output
          token: ${{ secrets.GITHUB_TOKEN }}

  generate-pacman:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18" # Upgraded from 16 to 18 to fix compatibility issues

      - name: Create output directory
        run: mkdir -p output

      - name: Clone and run Pacman generator
        run: |
          echo "Cloning Pacman contribution graph repository..."
          git clone https://github.com/abozanona/pacman-contribution-graph.git
          cd pacman-contribution-graph

          # List directory contents to debug
          echo "Directory contents:"
          ls -la

          echo "Installing dependencies..."
          npm install

          # Check for the actual entry point file
          echo "Looking for entry point file..."
          if [ -f "src/index.js" ]; then
            ENTRY_FILE="src/index.js"
          elif [ -f "app.js" ]; then
            ENTRY_FILE="app.js"
          elif [ -f "main.js" ]; then
            ENTRY_FILE="main.js"
          else
            ENTRY_FILE=$(find . -name "*.js" -not -path "*/node_modules/*" -type f | head -1)
          fi

          echo "Using entry file: $ENTRY_FILE"

          echo "Generating Pacman SVG..."
          node $ENTRY_FILE --username ${{ github.repository_owner }} --output-path ../output/pacman-contribution-graph.svg

          echo "Checking generated file..."
          ls -la ../output/

      - name: Push to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output
          branch: output
          token: ${{ secrets.GITHUB_TOKEN }}
