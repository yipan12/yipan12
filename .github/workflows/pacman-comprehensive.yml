name: GitHub Profile README Graphics Generator

on:
  workflow_dispatch: # Memungkinkan menjalankan workflow secara manual
  schedule:
    - cron: "0 0 * * *" # Berjalan setiap hari pada pukul 00:00 UTC
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move output files
        run: |
          mkdir -p output
          mv dist/snake.svg output/

      - name: Push to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output
          branch: output
          token: ${{ secrets.GITHUB_TOKEN }}

  generate-pacman:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Create output directory
        run: mkdir -p output

      - name: Clone and run Pacman generator
        run: |
          echo "Cloning Pacman contribution graph repository..."
          git clone https://github.com/abozanona/pacman-contribution-graph.git
          cd pacman-contribution-graph

          echo "Installing dependencies..."
          npm install

          echo "Generating Pacman SVG..."
          node index.js --username ${{ github.repository_owner }} --output-path ../output/pacman-contribution-graph.svg

          echo "Checking generated file..."
          ls -la ../output/

      - name: Push to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output
          branch: output
          token: ${{ secrets.GITHUB_TOKEN }}
